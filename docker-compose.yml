name: predictor

x-hermes-common: &hermes-common
  image: nousresearch/hermes-agent:latest
  restart: unless-stopped
  command: ["gateway", "run"]
  environment: &hermes-env
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_PORT: 8642
    API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
    LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
  networks:
    - predictor-runtime

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: predictor-clickhouse
    restart: unless-stopped
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - predictor-storage

  postgres:
    image: postgres:16-alpine
    container_name: predictor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictor}
      POSTGRES_USER: ${POSTGRES_USER:-predictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-predictor-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./predictor/storage/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-predictor} -d ${POSTGRES_DB:-predictor}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - predictor-storage

  atlas:
    image: arigaio/atlas:latest
    container_name: predictor-atlas
    profiles: ["migrations"]
    working_dir: /migrations
    command: ["migrate", "apply", "--env", "local"]
    environment:
      ATLAS_DATABASE_URL: clickhouse://clickhouse:9000/default
      ATLAS_TOKEN: ${ATLAS_TOKEN:-}
    volumes:
      - ./predictor/storage:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - predictor-storage

  hermes-serezha:
    <<: *hermes-common
    container_name: predictor-hermes-serezha
    volumes:
      - hermes-serezha-data:/opt/data
      - ./predictor/agents/serezha/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/serezha/skills:/opt/skills:ro

  hermes-saveliy:
    <<: *hermes-common
    container_name: predictor-hermes-saveliy
    volumes:
      - hermes-saveliy-data:/opt/data
      - ./predictor/agents/saveliy/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/saveliy/skills:/opt/skills:ro

  hermes-valera:
    <<: *hermes-common
    container_name: predictor-hermes-valera
    volumes:
      - hermes-valera-data:/opt/data
      - ./predictor/agents/valera/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/valera/skills:/opt/skills:ro

  hermes-kesha:
    <<: *hermes-common
    container_name: predictor-hermes-kesha
    volumes:
      - hermes-kesha-data:/opt/data
      - ./predictor/agents/kesha/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/kesha/skills:/opt/skills:ro

  esb:
    image: predictor-esb:local
    build:
      context: .
      dockerfile: predictor/esb/Dockerfile
    container_name: predictor-esb
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-predictor}:${POSTGRES_PASSWORD:-local-predictor-password}@postgres:5432/${POSTGRES_DB:-predictor}?sslmode=disable}
      ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
      HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      HERMES_SEREZHA_URL: http://hermes-serezha:8642
      HERMES_SAVELIY_URL: http://hermes-saveliy:8642
      HERMES_VALERA_URL: http://hermes-valera:8642
      HERMES_KESHA_URL: http://hermes-kesha:8642
      HERMES_POLL_INTERVAL: 2s
      AGENTS_DIR: /app/agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      hermes-serezha:
        condition: service_started
      hermes-saveliy:
        condition: service_started
      hermes-valera:
        condition: service_started
      hermes-kesha:
        condition: service_started
    networks:
      - predictor-storage
      - predictor-runtime

networks:
  predictor-runtime:
    name: predictor-runtime
  predictor-storage:
    name: predictor-storage
    internal: true

volumes:
  clickhouse-data:
  clickhouse-logs:
  postgres-data:
  hermes-serezha-data:
  hermes-saveliy-data:
  hermes-valera-data:
  hermes-kesha-data:
