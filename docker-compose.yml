name: predictor

x-hermes-common: &hermes-common
  image: nousresearch/hermes-agent:latest
  restart: unless-stopped
  command: ["gateway", "run"]
  environment: &hermes-env
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_PORT: 8642
    API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
    ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
    LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in .env}
  networks:
    - predictor-runtime

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: predictor-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-predictor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - predictor-storage

  postgres:
    image: postgres:16-alpine
    container_name: predictor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictor}
      POSTGRES_USER: ${POSTGRES_USER:-predictor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-predictor-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-predictor} -d ${POSTGRES_DB:-predictor}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - predictor-storage

  domain-postgres:
    image: postgres:16-alpine
    container_name: predictor-domain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOMAIN_POSTGRES_DB:-predictor_domain}
      POSTGRES_USER: ${DOMAIN_POSTGRES_USER:-predictor_domain}
      POSTGRES_PASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?Set DOMAIN_POSTGRES_PASSWORD in .env}
    volumes:
      - domain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOMAIN_POSTGRES_USER:-predictor_domain} -d ${DOMAIN_POSTGRES_DB:-predictor_domain}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:5433:5432"
    networks:
      - predictor-domain-storage

  minio:
    image: ${MINIO_IMAGE:-dappros/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: predictor-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-predictor-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks:
      - predictor-storage

  atlas-postgres:
    image: arigaio/atlas:latest
    container_name: predictor-atlas-postgres
    profiles: ["migrations"]
    working_dir: /migrations
    command: ["migrate", "apply", "--env", "local"]
    environment:
      ATLAS_DATABASE_URL: postgres://${POSTGRES_USER:-predictor}:${POSTGRES_PASSWORD:-local-predictor-password}@postgres:5432/${POSTGRES_DB:-predictor}?sslmode=disable
      ATLAS_TOKEN: ${ATLAS_TOKEN:-}
    volumes:
      - ./predictor/storage/postgres:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - predictor-storage

  atlas-clickhouse:
    image: arigaio/atlas:latest
    container_name: predictor-atlas-clickhouse
    profiles: ["migrations"]
    working_dir: /migrations
    command: ["migrate", "apply", "--env", "local"]
    environment:
      ATLAS_DATABASE_URL: clickhouse://${CLICKHOUSE_USER:-predictor}:${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}@clickhouse:9000/${CLICKHOUSE_DATABASE:-default}
      ATLAS_TOKEN: ${ATLAS_TOKEN:-}
    volumes:
      - ./predictor/storage/clickhouse:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - predictor-storage

  domain-api:
    image: predictor-domain-api:local
    build:
      context: .
      dockerfile: predictor/domain/src/PredictBoss.Domain.Api/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN_DATABASE_URL: Host=domain-postgres;Port=5432;Database=${DOMAIN_POSTGRES_DB:-predictor_domain};Username=${DOMAIN_POSTGRES_USER:-predictor_domain};Password=${DOMAIN_POSTGRES_PASSWORD:?Set DOMAIN_POSTGRES_PASSWORD in .env}
      DOMAIN_JWT_KEY: ${DOMAIN_JWT_KEY:?Set DOMAIN_JWT_KEY in .env}
      DOMAIN_JWT_ISSUER: ${DOMAIN_JWT_ISSUER:-predictor-domain}
      DOMAIN_JWT_AUDIENCE: ${DOMAIN_JWT_AUDIENCE:-predictor-domain}
      DOMAIN_CSV_PATH: /data/df_Uid_data_hack.csv
      ESB_BASE_URL: http://esb:8081
      ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - ${DOMAIN_CSV_PATH:?Set DOMAIN_CSV_PATH in .env}:/data/df_Uid_data_hack.csv:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      domain-postgres:
        condition: service_healthy
    networks:
      - predictor-domain-storage
      - predictor-runtime

  domain-worker:
    image: predictor-domain-worker:local
    build:
      context: .
      dockerfile: predictor/domain/src/PredictBoss.Domain.Worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DOMAIN_DATABASE_URL: Host=domain-postgres;Port=5432;Database=${DOMAIN_POSTGRES_DB:-predictor_domain};Username=${DOMAIN_POSTGRES_USER:-predictor_domain};Password=${DOMAIN_POSTGRES_PASSWORD:?Set DOMAIN_POSTGRES_PASSWORD in .env}
      ESB_BASE_URL: http://esb:8081
      ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
    depends_on:
      domain-api:
        condition: service_started
      esb:
        condition: service_started
    networks:
      - predictor-domain-storage
      - predictor-runtime

  frontend:
    image: predictor-frontend:local
    build:
      context: ./predictor/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      domain-api:
        condition: service_started
    networks:
      - predictor-runtime

  hermes-serezha:
    <<: *hermes-common
    container_name: predictor-hermes-serezha
    volumes:
      - hermes-serezha-data:/opt/data
      - ./predictor/agents/serezha/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/serezha/skills:/opt/skills:ro

  hermes-saveliy:
    <<: *hermes-common
    container_name: predictor-hermes-saveliy
    volumes:
      - hermes-saveliy-data:/opt/data
      - ./predictor/agents/saveliy/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/saveliy/skills:/opt/skills:ro

  hermes-valera:
    <<: *hermes-common
    container_name: predictor-hermes-valera
    volumes:
      - hermes-valera-data:/opt/data
      - ./predictor/agents/valera/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/valera/skills:/opt/skills:ro

  hermes-kesha:
    <<: *hermes-common
    container_name: predictor-hermes-kesha
    volumes:
      - hermes-kesha-data:/opt/data
      - ./predictor/agents/kesha/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/kesha/skills:/opt/skills:ro

  hermes-konstantin:
    <<: *hermes-common
    container_name: predictor-hermes-konstantin
    volumes:
      - hermes-konstantin-data:/opt/data
      - ./predictor/agents/konstantin/hermes.yaml:/opt/data/config.yaml:ro
      - ./predictor/agents/konstantin/skills:/opt/skills:ro

  esb:
    image: predictor-esb:local
    build:
      context: .
      dockerfile: predictor/esb/Dockerfile
    container_name: predictor-esb
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-predictor}:${POSTGRES_PASSWORD:-local-predictor-password}@postgres:5432/${POSTGRES_DB:-predictor}?sslmode=disable}
      ESB_API_KEY: ${ESB_API_KEY:?Set ESB_API_KEY in .env}
      HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY in .env}
      HERMES_SEREZHA_URL: http://hermes-serezha:8642
      HERMES_SAVELIY_URL: http://hermes-saveliy:8642
      HERMES_VALERA_URL: http://hermes-valera:8642
      HERMES_KESHA_URL: http://hermes-kesha:8642
      HERMES_KONSTANTIN_URL: http://hermes-konstantin:8642
      HERMES_POLL_INTERVAL: 2s
      AGENTS_DIR: /app/agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-predictor}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      hermes-serezha:
        condition: service_started
      hermes-saveliy:
        condition: service_started
      hermes-valera:
        condition: service_started
      hermes-kesha:
        condition: service_started
      hermes-konstantin:
        condition: service_started
    networks:
      - predictor-storage
      - predictor-runtime

networks:
  predictor-domain-storage:
    name: predictor-domain-storage
    internal: true
  predictor-runtime:
    name: predictor-runtime
  predictor-storage:
    name: predictor-storage
    internal: true

volumes:
  domain-postgres-data:
  clickhouse-data:
  clickhouse-logs:
  postgres-data:
  minio-data:
  hermes-serezha-data:
  hermes-saveliy-data:
  hermes-valera-data:
  hermes-kesha-data:
  hermes-konstantin-data:
