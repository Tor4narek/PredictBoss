name: Inspect Fedora agent logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          FEDORA_SSH_KEY: ${{ secrets.FEDORA_SSH_KEY }}
          FEDORA_KNOWN_HOSTS: ${{ secrets.FEDORA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$FEDORA_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$FEDORA_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read service status and recent agent warnings
        shell: bash
        env:
          FEDORA_HOST: ${{ secrets.FEDORA_HOST }}
          FEDORA_USER: ${{ secrets.FEDORA_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            "$FEDORA_USER@$FEDORA_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          for name in predictor-hermes-kesha predictor-hermes-serezha predictor-hermes-valera predictor-hermes-saveliy predictor-hermes-konstantin predictor-esb; do
            echo "--- $name recent warnings ---"
            matches=$(docker logs --since 2h "$name" 2>&1 | grep -Ei 'Failed to connect to MCP server|Unknown provider|no valid toolsets configured|RuntimeError:|Traceback|panic:|level=error' | tail -n 25 || true)
            if [ -n "$matches" ]; then printf '%s\n' "$matches"; else echo 'No matching warnings/errors in the last 2h'; fi
          done
          REMOTE
