model:
  provider: ${HERMES_MODEL_PROVIDER}
  default: ${AGENT_SEREZHA_MODEL_ID}
  base_url: https://changellenge.up.railway.app/v1
  key_env: LLM_API_KEY
platform_toolsets:
  api_server: []
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: ${AGENT_SEREZHA_MAX_CONCURRENT_RUNS}
agent:
  max_turns: ${AGENT_SEREZHA_MAX_TURNS}
  reasoning_effort: ${AGENT_SEREZHA_REASONING_EFFORT}
  disabled_toolsets: [terminal, browser, web, file, memory, delegation, process, automation]
skills:
  external_dirs: [/opt/skills]
mcp_servers:
  esb:
    url: http://esb:8081/mcp
    headers:
      Authorization: "Bearer ${ESB_API_KEY}"
    supports_parallel_tool_calls: false
    tools:
      include: [save_news_and_facts]
      prompts: false
      resources: false
