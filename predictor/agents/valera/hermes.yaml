model:
  provider: ${HERMES_MODEL_PROVIDER}
  default: ${AGENT_VALERA_MODEL_ID}
  base_url: https://api.alfahack-gateway26.ru/v1
  key_env: LLM_API_KEY
platform_toolsets:
  api_server: [mcp-esb]
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: ${AGENT_VALERA_MAX_CONCURRENT_RUNS}
agent:
  max_turns: ${AGENT_VALERA_MAX_TURNS}
  reasoning_effort: ${AGENT_VALERA_REASONING_EFFORT}
  disabled_toolsets: [terminal, browser, web, file, memory, delegation, process, automation]
skills:
  external_dirs: [/opt/skills]
mcp_servers:
  esb:
    url: ${ESB_MCP_URL}
    headers:
      Authorization: "Bearer ${MCP_TOKEN_VALERA}"
    supports_parallel_tool_calls: false
    tools:
      include: [get_company_metrics, save_company_profile_and_metrics]
      prompts: false
      resources: false
