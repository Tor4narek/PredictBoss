model:
  provider: custom
  default: deepseek/deepseek-v4.1-flash
  base_url: https://changellenge.up.railway.app/v1
  key_env: LLM_API_KEY
fallback_providers:
  - provider: custom
    model: deepseek/deepseek-v4.1-flash
    base_url: https://api.alfahack-gateway26.ru/v1
    key_env: LLM_API_KEY
platform_toolsets:
  api_server: []
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: 0
agent:
  max_turns: 12
  reasoning_effort: low
  disabled_toolsets: [terminal, browser, web, file, memory, delegation, process, automation]
skills:
  external_dirs: [/opt/skills]
mcp_servers:
  esb:
    url: http://esb:8081/mcp
    headers:
      Authorization: "Bearer ${ESB_API_KEY}"
    supports_parallel_tool_calls: false
    tools:
      include: [get_company_profile, get_company_facts, get_company_metrics, get_consultant_context]
      prompts: false
      resources: false
