model:
  provider: ${HERMES_MODEL_PROVIDER}
  default: ${AGENT_SAVELIY_MODEL_ID}
  base_url: https://changellenge.up.railway.app/v1
  key_env: LLM_API_KEY
platform_toolsets:
  api_server: []
gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    max_concurrent_runs: ${AGENT_SAVELIY_MAX_CONCURRENT_RUNS}
agent:
  max_turns: ${AGENT_SAVELIY_MAX_TURNS}
  reasoning_effort: ${AGENT_SAVELIY_REASONING_EFFORT}
  disabled_toolsets: [terminal, browser, web, file, memory, delegation, process, automation]
skills:
  external_dirs: [/opt/skills]
mcp_servers:
  esb:
    url: ${ESB_MCP_URL}
    headers:
      Authorization: "Bearer ${MCP_TOKEN_SAVELIY}"
    supports_parallel_tool_calls: false
    tools:
      include: [get_company_profile, get_facts, save_fact_company_links]
      prompts: false
      resources: false
