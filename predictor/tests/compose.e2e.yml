name: predictor-esb-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: predictor
      POSTGRES_USER: predictor
      POSTGRES_PASSWORD: test-only-password
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor -d predictor"]
      interval: 2s
      timeout: 3s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: predictor
      CLICKHOUSE_PASSWORD: test-clickhouse-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40
    ports:
      - "18123:8123"
    volumes:
      - ch-data:/var/lib/clickhouse

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: predictor-e2e
      MINIO_ROOT_PASSWORD: test-minio-password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 40

  mock-runtime:
    image: python:3.12-alpine
    command: ["python", "/app/mock_server.py"]
    environment:
      MOCK_PORT: "8090"
    ports:
      - "18090:8090"
    volumes:
      - ./mock_server.py:/app/mock_server.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 40

  esb:
    image: predictor-esb-e2e:local
    build:
      context: ../..
      dockerfile: predictor/esb/Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://predictor:test-only-password@postgres:5432/predictor?sslmode=disable
      ESB_API_KEY: test-esb-api-key
      HERMES_API_KEY: test-hermes-api-key
      HERMES_SEREZHA_URL: http://mock-runtime:8090
      HERMES_SAVELIY_URL: http://mock-runtime:8090
      HERMES_VALERA_URL: http://mock-runtime:8090
      HERMES_KESHA_URL: http://mock-runtime:8090
      HERMES_KONSTANTIN_URL: http://mock-runtime:8090
      HERMES_POLL_INTERVAL: 50ms
      CLEANUP_ENABLED: ${E2E_CLEANUP_ENABLED:-false}
      CLEANUP_STATUS_CHECK_INTERVAL: ${E2E_CLEANUP_STATUS_INTERVAL:-1h}
      CLEANUP_RETENTION_CHECK_INTERVAL: ${E2E_CLEANUP_RETENTION_INTERVAL:-24h}
      CLEANUP_BATCH_SIZE: ${E2E_CLEANUP_BATCH_SIZE:-500}
      CLEANUP_QUEUED_STALE_AFTER: ${E2E_CLEANUP_QUEUED_STALE_AFTER:-10m}
      CLEANUP_RUNNING_STALE_AFTER: ${E2E_CLEANUP_RUNNING_STALE_AFTER:-30m}
      CLEANUP_ACTIVE_MAX_RETRIES: ${E2E_CLEANUP_ACTIVE_MAX_RETRIES:-1}
      CLEANUP_CALL_PAYLOAD_RETENTION: ${E2E_CLEANUP_CALL_PAYLOAD_RETENTION:-2160h}
      CLEANUP_CALL_RECORD_RETENTION: ${E2E_CLEANUP_CALL_RECORD_RETENTION:-2160h}
      CLEANUP_CONTEXT_SUMMARY_RETENTION: ${E2E_CLEANUP_CONTEXT_SUMMARY_RETENTION:-never}
      CLEANUP_MESSAGES_RETENTION_SEREZHA: ${E2E_CLEANUP_MESSAGES_RETENTION_SEREZHA:-never}
      CLEANUP_MESSAGES_RETENTION_SAVELIY: ${E2E_CLEANUP_MESSAGES_RETENTION_SAVELIY:-never}
      CLEANUP_MESSAGES_RETENTION_VALERA: ${E2E_CLEANUP_MESSAGES_RETENTION_VALERA:-never}
      CLEANUP_MESSAGES_RETENTION_KESHA: ${E2E_CLEANUP_MESSAGES_RETENTION_KESHA:-never}
      CLEANUP_MESSAGES_RETENTION_KONSTANTIN: ${E2E_CLEANUP_MESSAGES_RETENTION_KONSTANTIN:-never}
      CLEANUP_PROCESSED_NEWS_TEXT_RETENTION: ${E2E_CLEANUP_PROCESSED_NEWS_TEXT_RETENTION:-168h}
      CLEANUP_UNPROCESSED_NEWS_TEXT_RETENTION: ${E2E_CLEANUP_UNPROCESSED_NEWS_TEXT_RETENTION:-never}
      CLEANUP_NEWS_METADATA_RETENTION: ${E2E_CLEANUP_NEWS_METADATA_RETENTION:-never}
      CLEANUP_NEWS_MARKER_RETENTION: ${E2E_CLEANUP_NEWS_MARKER_RETENTION:-never}
      CLEANUP_FACTS_RETENTION: ${E2E_CLEANUP_FACTS_RETENTION:-never}
      CLEANUP_FACT_COMPANY_RETENTION: ${E2E_CLEANUP_FACT_COMPANY_RETENTION:-never}
      CLEANUP_METRIC_OBSERVATIONS_RETENTION: ${E2E_CLEANUP_METRIC_OBSERVATIONS_RETENTION:-never}
      CLEANUP_METRIC_TOTALS_RETENTION: ${E2E_CLEANUP_METRIC_TOTALS_RETENTION:-never}
      CLEANUP_COMPANY_ANALYSES_RETENTION: ${E2E_CLEANUP_COMPANY_ANALYSES_RETENTION:-never}
      AGENTS_DIR: /app/agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: predictor
      CLICKHOUSE_PASSWORD: test-clickhouse-password
      S3_BUCKET: predictor-e2e
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: predictor-e2e
      S3_SECRET_ACCESS_KEY: test-minio-password
      S3_FORCE_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "true"
      HTTP_MAX_JSON_BODY_BYTES: "8192"
      MAX_NEWS_TEXT_BYTES: "1024"
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mock-runtime:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 3s
      retries: 40

  atlas-postgres:
    image: arigaio/atlas:latest
    profiles: ["migrations"]
    working_dir: /migrations
    command: ["migrate", "apply", "--env", "local"]
    environment:
      ATLAS_DATABASE_URL: postgres://predictor:test-only-password@postgres:5432/predictor?sslmode=disable
    volumes:
      - ../storage/postgres:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  ch-data:
  minio-data:
