version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
